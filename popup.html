<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { width: 350px; }
  </style>
</head>
<body class="p-4 bg-gradient-to-br from-purple-100 to-blue-100">
  <div class="bg-white rounded-lg shadow-lg p-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">⏰ BrainRotAI</h2>
    
    <div class="mb-4 p-3 bg-blue-50 rounded-lg">
      <p class="text-sm text-gray-600">Time Remaining</p>
      <p id="timeDisplay" class="text-3xl font-bold text-gray-800">0:00</p>
    </div>

    <div class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Question Interval (minutes)
        </label>
        <input
          type="number"
          id="questionInterval"
          min="1"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Reward Time (minutes)
        </label>
        <input
          type="number"
          id="rewardTime"
          min="1"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        />
      </div>

      <button
        id="saveBtn"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition"
      >
        Save Settings
      </button>

      <div id="saveMessage" class="hidden p-2 rounded-lg text-sm text-center"></div>
    </div>

    <div class="mt-4 pt-4 border-t border-gray-200 text-xs text-gray-500 text-center">
      <p>Stay focused, stay productive! 🧠</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
