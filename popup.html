<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup-page">
  <div class="popup-container">
    <h2 class="popup-header">⏰ BrainRotAI</h2>
    
    <div class="time-card">
      <p class="time-label">Time Remaining</p>
      <p class="time-display" id="timeDisplay">0:00</p>
    </div>

    <div class="form-section">
      <div class="form-group">
        <label class="form-label">Question Interval (minutes)</label>
        <input
          type="number"
          id="questionInterval"
          min="1"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Reward Time (minutes)</label>
        <input
          type="number"
          id="rewardTime"
          min="1"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Challenge Mode</label>
        <select id="challengeMode" class="form-input">
          <option value="multiplayer">1v1 Multiplayer (Recommended)</option>
          <option value="single">Single Player</option>
        </select>
      </div>

      <details class="firebase-config-section">
        <summary class="firebase-config-toggle">🔑 Firebase Configuration (for Multiplayer)</summary>
        <div class="firebase-config-content">
          <p class="firebase-help">Get these from <a href="https://console.firebase.google.com/" target="_blank">Firebase Console</a></p>
          <div class="form-group">
            <label class="form-label">API Key</label>
            <input type="text" id="firebaseApiKey" placeholder="AIzaSy..." class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Project ID</label>
            <input type="text" id="firebaseProjectId" placeholder="your-project-id" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Database URL</label>
            <input type="text" id="firebaseDatabaseUrl" placeholder="https://your-project-default-rtdb.firebaseio.com/" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Messaging Sender ID</label>
            <input type="text" id="firebaseMessagingSenderId" placeholder="123456789" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">App ID</label>
            <input type="text" id="firebaseAppId" placeholder="1:123456789:web:abc123" class="form-input" />
          </div>
        </div>
      </details>

      <div class="form-group">
        <label class="form-label">Add new website to block list (domain only, e.g., example.com)</label>
        <input
          type="text"
          id="blockedSite"
          placeholder="example.com"
          class="form-input"
        />
      </div>

      <button id="saveBtn" class="btn-secondary">
        Save Settings
      </button>

      <div id="saveMessage" class="save-message"></div>

      <div class="blocked-section">
        <label class="blocked-label">Blocked Websites</label>
        <ul id="blockedList" class="blocked-list"></ul>
      </div>
    </div>

    <div class="popup-footer">
      <p>Stay focused, stay productive! 🧠</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
