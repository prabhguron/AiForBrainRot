<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup-page">
  <div class="popup-wrapper">
    <div class="cartoon-box card card-orange popup-header-card">
      <h1 class="popup-title">⏰ BrainRotAI</h1>
      <p class="popup-subtitle">Stay focused, stay productive!</p>
    </div>

    <div class="cartoon-box card card-sky settings-card">
      <div class="time-section">
        <p class="section-label">Time Remaining</p>
        <p class="time-display" id="timeDisplay">0:00</p>
      </div>
    </div>

    <div class="cartoon-box card card-sky settings-card">
      <h3 class="card-title">⚙️ Settings</h3>
      
      <div class="form-group">
        <label class="form-label">Question Interval (minutes)</label>
        <input type="number" id="questionInterval" min="1" class="input-cartoon" />
      </div>

      <div class="form-group">
        <label class="form-label">Reward Time (minutes)</label>
        <input type="number" id="rewardTime" min="1" class="input-cartoon" />
      </div>

      <div class="form-group">
        <label class="form-label">Add website (domain only)</label>
        <div class="input-with-btn">
          <input type="text" id="blockedSite" placeholder="example.com" class="input-cartoon" />
          <button id="saveBtn" class="btn btn-success">Save</button>
        </div>
      </div>

      <div id="saveMessage" class="save-message"></div>
    </div>

    <div class="cartoon-box card card-rose blocked-card">
      <h3 class="card-title">🚫 Blocked Websites</h3>
      <ul id="blockedList" class="blocked-list-new"></ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
