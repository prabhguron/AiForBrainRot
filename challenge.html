<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI - Math Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cartoon-box card card-sky" style="max-width: 500px; margin: 0 auto;">
    <div class="mission-header">
      <h2 class="mission-title">Solve the Problem</h2>
    </div>

    <div id="message" class="alert"></div>
    
    <div class="challenge-content">
      <div class="question-box cartoon-box">
        <div id="question" class="question-text"></div>
      </div>

      <div class="answer-wrapper">
        <input
          type="number"
          id="answer"
          placeholder="Your answer"
          autofocus
          class="input-cartoon"
        />
        <button id="submitBtn" class="btn btn-primary">
          +
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-compact">
        <span class="stat-label">Score:</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-compact">
        <span class="emoji-face" id="emojiFace">🤔</span>
      </div>
      <div class="stat-compact">
        <span class="stat-label">Streak:</span>
        <span class="stat-value" id="streak">0</span>
      </div>
    </div>
  </div>

  <script src="challenge.js"></script>
</body>
</html>
