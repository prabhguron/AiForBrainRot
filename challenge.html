<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI - Math Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-500 via-pink-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="inline-block p-4 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full mb-4">
        <span class="text-6xl">🧠</span>
      </div>
      <h1 class="text-4xl font-bold text-gray-800 mb-2">Time's Up!</h1>
      <p class="text-gray-600">Solve this problem to continue browsing</p>
    </div>

    <div id="message" class="hidden mb-4 p-4 rounded-lg"></div>

    <div class="space-y-6">
      <div class="text-center">
        <div id="question" class="text-5xl font-bold text-gray-800 mb-6 py-8 bg-gray-50 rounded-xl"></div>
        <input
          type="number"
          id="answer"
          placeholder="Your answer"
          autofocus
          class="w-full px-6 py-4 text-2xl text-center border-2 border-purple-300 rounded-xl focus:ring-4 focus:ring-purple-500 focus:border-transparent"
        />
      </div>

      <button
        id="submitBtn"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-xl font-bold text-lg hover:from-purple-700 hover:to-pink-700 transition shadow-lg hover:shadow-xl"
      >
        Submit Answer
      </button>
    </div>

    <div class="mt-6 flex items-center justify-between text-sm text-gray-600">
      <div>
        <span>Score: <span id="score">0</span></span>
      </div>
      <div>
        <span>🔥 Streak: <span id="streak">0</span></span>
      </div>
    </div>
  </div>

  <script src="challenge.js"></script>
</body>
</html>
