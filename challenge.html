<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRotAI - Math Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="challenge-container">
  <div class="challenge-card">
    <div class="challenge-header">
      <span class="challenge-icon">🧠</span>
      <h1 class="challenge-title">LOCK IN</h1>
      <p class="challenge-subtitle">Solve this problem to continue browsing</p>
    </div>

    <div id="message" class="alert"></div>
    
    <div class="section-spacing">
      <div class="challenge-section text-center">
        <div id="question" class="question-text"></div>
        <input
          type="number"
          id="answer"
          placeholder="Your answer"
          autofocus
          class="question-input"
        />
      </div>

      <button id="submitBtn" class="btn btn-primary">
        Submit Answer
      </button>
    </div>

    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="emoji-face" id="emojiFace"></span>
      </div>
      <div class="stat-item">
        <span class="stat-label">🔥 Streak</span>
        <span class="stat-value" id="streak">0</span>
      </div>
    </div>
  </div>

  <script src="challenge.js"></script>
</body>
</html>
